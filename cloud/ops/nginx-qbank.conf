server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 上传新切的卷走的是 rsync/ssh，不经过这里；这个值只防有人从网页 POST 大包
    client_max_body_size 32m;

    # 访问日志（logrotate 每天切）
    access_log /opt/qbank/logs/nginx-access.log;
    error_log  /opt/qbank/logs/nginx-error.log;

    # 题图：不可长缓存。URL 固定是 /files/.../q04.webp，没有版本号，
    # 老师换图后如果给了 7 天缓存，刷新也看不到新图（只能清浏览器缓存）。
    # 用 no-cache（不是 no-store）而不是 no-store：文件没变时后端返回 304，
    # 几乎不耗带宽；一变立刻拿到新的。
    location /files/ {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache";
    }

    # 前端构建产物带内容哈希，可以放心长缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 首次打开列表页 / 索引重建时后端会慢一点，别让 nginx 提前掐断
        proxy_read_timeout 120s;
    }
}
